apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: webrom
data:
  default.conf: |
    server {
      listen 443 ssl;
      server_name localhost;

      ssl_certificate /etc/ssl/cert.pem;
      ssl_certificate_key /etc/ssl/key.pem;

      location /cgi-bin/ {
        proxy_pass http://app.approm.svc.cluster.local:81;
      }

      location / {
        proxy_pass http://web:80;
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: nginx-certs
  namespace: webrom
type: Opaque
data:
  cert.pem: 
  key.pem:  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-https
  namespace: webrom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-https
  template:
    metadata:
      labels:
        app: nginx-https
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 443

        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        - name: nginx-certs
          mountPath: /etc/ssl

        readinessProbe:
          tcpSocket:
            port: 443
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          tcpSocket:
            port: 443
          initialDelaySeconds: 10
          periodSeconds: 10

      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: nginx-certs
        secret:
          secretName: nginx-certs

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-https
  namespace: webrom
spec:
  selector:
    app: nginx-https
  ports:
    - port: 443
      targetPort: 443
  type: ClusterIP
