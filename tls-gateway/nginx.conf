worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # start: TLS-terminering og samme-origin proxy i steg 9 - oppfyller NF7 (TLS/HTTPS) og F1 (sikker frontend-flyt) (person 4 og person 5)
  server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate /run/secrets/tls/tls.crt;
    ssl_certificate_key /run/secrets/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLSCACHE:2m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /cgi-bin/ {
      proxy_pass http://127.0.0.1:8081/cgi-bin/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://127.0.0.1:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
  # slutt: TLS-terminering og samme-origin proxy i steg 9 - oppfyller NF7 (TLS/HTTPS) og F1 (sikker frontend-flyt) (person 4 og person 5)
}
