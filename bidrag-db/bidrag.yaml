apiVersion: v1
kind: Service
metadata:
  name: bidrag-db
  labels:
    app: bidrag-db
    component: bidrag-db
    tier: backend
    security: hardened
spec:
  selector:
    app: bidrag-db
  ports:
    - name: http
      port: 82
      targetPort: 8082
---
apiVersion: v1
kind: Pod
metadata:
  name: bidrag-db
  labels:
    app: bidrag-db
    component: bidrag-db
    tier: backend
    security: hardened
spec:
  serviceAccountName: allpodd-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 10001
  terminationGracePeriodSeconds: 10
  initContainers:
    - name: seed-bidrag-db
      image: localhost/bidrag-db:latest
      imagePullPolicy: Never
      command:
        - /var/www/init-encrypted-db.sh
        - /data/bidrag.db
        - /run/secrets/storage/bidrag-db-key
      volumeMounts:
        - name: bidrag-db-data
          mountPath: /data
        - name: storage-key-material
          mountPath: /run/secrets/storage
          readOnly: true
  containers:
    - name: bidrag-db
      image: localhost/bidrag-db:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8082
          name: bidrag-db
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        - name: BIDRAG_DB_PATH
          value: /data/bidrag.db
        - name: BIDRAG_DB_KEY_FILE
          value: /run/secrets/storage/bidrag-db-key
        - name: PSEUDONYM_INTERNAL_URL
          value: http://pseudonym-db:83/cgi-bin/index.cgi
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "250m"
          memory: "192Mi"
      readinessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8082"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8082"]
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8082"]
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: bidrag-db-data
          mountPath: /data
        - name: storage-key-material
          mountPath: /run/secrets/storage
          readOnly: true
        - name: bidrag-tmp
          mountPath: /tmp
  volumes:
    - name: bidrag-db-data
      persistentVolumeClaim:
        claimName: bidrag-pvc
    - name: storage-key-material
      secret:
        secretName: allpodd-storage-secrets
    - name: bidrag-tmp
      emptyDir: {}
