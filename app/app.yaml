apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: app
    component: app
    tier: application
    security: hardened
spec:
  selector:
    app: app
  ports:
    - name: app
      port: 81
      targetPort: 8081
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
    component: app
    tier: application
    security: hardened
spec:
  serviceAccountName: allpodd-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  containers:
    - name: app
      image: localhost/app:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8081
          name: app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      readinessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8081"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8081"]
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8081"]
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: app-tmp
          mountPath: /tmp
  volumes:
    - name: app-tmp
      emptyDir: {}
