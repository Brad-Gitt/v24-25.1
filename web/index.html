<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BIDRAG</title>
    <link rel="stylesheet" href="style.css">
    <!-- start: Laster klientside-kryptering for kommentar - oppfyller F1 (privat kommentar) og NF7 (kryptering i klient) (person 3) -->
    <script src="crypto.js" defer></script>
    <!-- slutt: Laster klientside-kryptering for kommentar - oppfyller F1 (privat kommentar) og NF7 (kryptering i klient) (person 3) -->
  </head>
  <body>
    <form action="http://localhost:8081/cgi-bin/index.cgi" method="post" id="bidrag-form"> <!-- fikset url -->

      <div class="buttons">
        <input type="submit" name="handling" value="Ny" id="ny-btn">
        <input type="submit" name="handling" value="Endre" id="endre-btn">
        <input type="submit" name="handling" value="Slett" id="slett-btn">
        <input type="submit" name="handling" value="Liste" id="liste-btn">
        <input type="submit" name="handling" value="Min" id="min-btn"> <!-- la til min -->
        <input type="submit" name="handling" value="Admin" id="admin-btn"> <!-- la til admin knapp for admin-visning -->
      </div>

      <div class="field">
        <label for="epost">E-post</label>
        <input name="epost" type="text" id="epost">
      </div>

      <div class="field">
        <label for="passord">Passord</label>
        <input name="passord" type="password" id="passord"> <!-- endret type på passord -->
      </div>

      <div class="field">
        <label for="tittel">Tittel</label>
        <input name="tittel" type="text" id="tittel">
      </div>

      <div class="field">
        <label for="kommentar">Kommentar</label>
        <textarea name="kommentar" id="kommentar"></textarea>
      </div>

      <!-- start: Skjult krypteringsmetadata og brukerinfo for steg 6 - oppfyller F1 (privat kommentar) og NF7 (nøkkelhåndtering i klient) (person 3) -->
      <input name="offentlig_nokkel" type="hidden" id="offentlig_nokkel">
      <p id="kryptering-status" class="crypto-status" hidden aria-live="polite"></p>
      <p class="privacy-note">Kommentar krypteres i nettleseren ved <strong>Ny</strong> og <strong>Endre</strong>. I denne fasen vil <strong>Min</strong> fortsatt vise lagret ciphertext frem til steg 7.</p>
      <!-- slutt: Skjult krypteringsmetadata og brukerinfo for steg 6 - oppfyller F1 (privat kommentar) og NF7 (nøkkelhåndtering i klient) (person 3) -->

      <div class="field">
        <label for="tekst">Tekst</label>
        <textarea name="tekst" id="tekst"></textarea>
      </div>

    </form>

    <br/>
  </body>
</html>
