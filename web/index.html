<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BIDRAG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="crypto.js" defer></script>
  </head>
  <body>
    <!-- start: Samme-origin endepunkt via TLS-gateway i steg 9 - oppfyller NF7 (TLS/HTTPS) og F1 (sikker brukerflyt) (person 4 og person 5) -->
    <form action="/cgi-bin/index.cgi" method="post" id="bidrag-form">
    <!-- slutt: Samme-origin endepunkt via TLS-gateway i steg 9 - oppfyller NF7 (TLS/HTTPS) og F1 (sikker brukerflyt) (person 4 og person 5) -->
      <div class="logo-wrap">
        <img src="skytjenester-logo.png" alt="Allpodd-logo" class="site-logo">
      </div>

      <div class="buttons">
        <input type="submit" name="handling" value="Ny" id="ny-btn">
        <input type="submit" name="handling" value="Endre" id="endre-btn">
        <input type="submit" name="handling" value="Slett" id="slett-btn">
        <input type="submit" name="handling" value="Liste" id="liste-btn">
        <input type="submit" name="handling" value="Min" id="min-btn"> <!-- la til min -->
        <input type="submit" name="handling" value="Admin" id="admin-btn"> <!-- la til admin knapp for admin-visning -->
      </div>

      <div class="field">
        <label for="epost">E-post</label>
        <input name="epost" type="text" id="epost">
      </div>

      <div class="field">
        <label for="passord">Passord</label>
        <input name="passord" type="password" id="passord"> <!-- endret type på passord -->
      </div>

      <div class="field">
        <label for="tittel">Tittel</label>
        <input name="tittel" type="text" id="tittel">
      </div>

      <div class="field">
        <label for="kommentar">Kommentar</label>
        <textarea name="kommentar" id="kommentar"></textarea>
      </div>

      <input name="offentlig_nokkel" type="hidden" id="offentlig_nokkel">

      <div class="field">
        <label for="tekst">Tekst</label>
        <textarea name="tekst" id="tekst"></textarea>
      </div>

      <!-- start: Felles outputfelt for Liste, Min og Admin i steg 7 - oppfyller F1 (egen visning av privat kommentar) og NF1 (tydelig og sikker brukerflyt) (person 5) -->
      <pre id="respons-felt" class="respons-felt" hidden></pre>
      <!-- slutt: Felles outputfelt for Liste, Min og Admin i steg 7 - oppfyller F1 (egen visning av privat kommentar) og NF1 (tydelig og sikker brukerflyt) (person 5) -->
    </form>

    <br/>
  </body>
</html>
