# start: Herdet service- og podmanifest for steg 8 - oppfyller NF1 (least privilege og defense in depth), NF2 (Kubernetes), NF3 (lokal kjøring) og deler av NF7 (recovery) (person 4)
apiVersion: v1
kind: Service
metadata:
  name: allpodd
  labels:
    # start: Identifikasjonsetiketter for samlet inngangspunkt - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: gateway
    tier: edge
    security: hardened
    # slutt: Identifikasjonsetiketter for samlet inngangspunkt - oppfyller NF6 (merking av skyverdier) (person 4)
spec:
  type: NodePort
  selector:
    app: allpodd
  ports:
    # start: HTTPS-eksponering via dedikert TLS-gateway i steg 9 - oppfyller NF7 (TLS/HTTPS) og NF1 (redusert angrepsflate) (person 4 og person 5)
    - name: https
      nodePort: 30443
      port: 443
      targetPort: 8443
    # slutt: HTTPS-eksponering via dedikert TLS-gateway i steg 9 - oppfyller NF7 (TLS/HTTPS) og NF1 (redusert angrepsflate) (person 4 og person 5)
---
apiVersion: v1
kind: Pod
metadata:
  name: allpodd
  labels:
    # start: Identifikasjonsetiketter for herdede arbeidslaster - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: allpodd-stack
    tier: application
    security: hardened
    # slutt: Identifikasjonsetiketter for herdede arbeidslaster - oppfyller NF6 (merking av skyverdier) (person 4)
spec:
  # start: Dedikert servicekonto uten API-token i podden - oppfyller NF1 (least privilege og RBAC-tilnærming) (person 4)
  serviceAccountName: allpodd-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  # slutt: Dedikert servicekonto uten API-token i podden - oppfyller NF1 (least privilege og RBAC-tilnærming) (person 4)
  # start: Pod-nivå hardening og kontrollert nedstenging - oppfyller NF1 (defense in depth) og deler av NF7 (recovery) (person 4)
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 10001
  terminationGracePeriodSeconds: 10
  # slutt: Pod-nivå hardening og kontrollert nedstenging - oppfyller NF1 (defense in depth) og deler av NF7 (recovery) (person 4)
  # start: Init-containere som seed-er persistente databaser før oppstart - oppfyller F3 (persistens) og deler av NF7 (recovery) (person 4)
  initContainers:
    - name: seed-bidrag-db
      image: localhost/bidrag-db:latest
      imagePullPolicy: Never
      command:
        - /var/www/init-encrypted-db.sh
        - /data/bidrag.db
        - /run/secrets/storage/bidrag-db-key
      volumeMounts:
        - name: bidrag-db-data
          mountPath: /data
        - name: storage-key-material
          mountPath: /run/secrets/storage
          readOnly: true
    - name: seed-pseudonym-db
      image: localhost/pseudonym-db:latest
      imagePullPolicy: Never
      command:
        - /var/www/init-encrypted-db.sh
        - /data/pseudonym.db
        - /run/secrets/storage/pseudonym-db-key
      volumeMounts:
        - name: pseudonym-db-data
          mountPath: /data
        - name: storage-key-material
          mountPath: /run/secrets/storage
          readOnly: true
  # slutt: Init-containere som seed-er persistente databaser før oppstart - oppfyller F3 (persistens) og deler av NF7 (recovery) (person 4)
  containers:
    - name: tls-gateway
      image: localhost/tls-gateway:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8443
          name: https
      # start: TLS-gateway med cert-secret og samme-origin proxy i steg 9 - oppfyller NF7 (TLS/HTTPS og nøkkelhåndtering) og NF1 (forsvar i dybden) (person 4 og person 5)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "100m"
          memory: "96Mi"
      readinessProbe:
        tcpSocket:
          port: 8443
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        tcpSocket:
          port: 8443
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        tcpSocket:
          port: 8443
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: tls-certificates
          mountPath: /run/secrets/tls
          readOnly: true
        - name: tls-tmp
          mountPath: /tmp
      # slutt: TLS-gateway med cert-secret og samme-origin proxy i steg 9 - oppfyller NF7 (TLS/HTTPS og nøkkelhåndtering) og NF1 (forsvar i dybden) (person 4 og person 5)
    - name: app
      image: localhost/app:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8081
          name: app
      # start: Container-hardening for app-tjenesten - oppfyller NF1 (minste privilegium og defense in depth) (person 4)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      readinessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8081"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8081"]
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8081"]
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: app-tmp
          mountPath: /tmp
      # slutt: Container-hardening for app-tjenesten - oppfyller NF1 (minste privilegium og defense in depth) (person 4)
    - name: bidrag-db
      image: localhost/bidrag-db:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8082
          name: bidrag-db
      # start: Container-hardening for bidrag-databasen - oppfyller NF1 (minste privilegium og defense in depth), F3 (persistens) og deler av NF7 (recovery) (person 4)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      env:
        - name: BIDRAG_DB_PATH
          value: /data/bidrag.db
        - name: BIDRAG_DB_KEY_FILE
          value: /run/secrets/storage/bidrag-db-key
        - name: PSEUDONYM_INTERNAL_URL
          value: http://127.0.0.1:8083/cgi-bin/index.cgi
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "250m"
          memory: "192Mi"
      readinessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8082"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8082"]
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8082"]
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: bidrag-db-data
          mountPath: /data
        - name: storage-key-material
          mountPath: /run/secrets/storage
          readOnly: true
        - name: bidrag-tmp
          mountPath: /tmp
      # slutt: Container-hardening for bidrag-databasen - oppfyller NF1 (minste privilegium og defense in depth), F3 (persistens) og deler av NF7 (recovery) (person 4)
    - name: pseudonym-db
      image: localhost/pseudonym-db:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8083
          name: pseudonym-db
      # start: Container-hardening for pseudonym-databasen - oppfyller NF1 (minste privilegium og defense in depth), F3 (persistens) og deler av NF7 (recovery) (person 4)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      env:
        - name: PSEUDONYM_DB_PATH
          value: /data/pseudonym.db
        - name: PSEUDONYM_DB_KEY_FILE
          value: /run/secrets/storage/pseudonym-db-key
      resources:
        requests:
          cpu: "25m"
          memory: "64Mi"
        limits:
          cpu: "150m"
          memory: "128Mi"
      readinessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8083"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8083"]
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8083"]
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: pseudonym-db-data
          mountPath: /data
        - name: storage-key-material
          mountPath: /run/secrets/storage
          readOnly: true
        - name: pseudonym-tmp
          mountPath: /tmp
      # slutt: Container-hardening for pseudonym-databasen - oppfyller NF1 (minste privilegium og defense in depth), F3 (persistens) og deler av NF7 (recovery) (person 4)
    - name: web
      image: localhost/web:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
          name: web
      # start: Container-hardening for web-frontend - oppfyller NF1 (minste privilegium og defense in depth) (person 4)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "100m"
          memory: "96Mi"
      readinessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8080"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8080"]
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 8080"]
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: web-tmp
          mountPath: /tmp
      # slutt: Container-hardening for web-frontend - oppfyller NF1 (minste privilegium og defense in depth) (person 4)
  # start: PVC-er og isolerte tmp-volumer for skrivebehov - oppfyller F3 (persistens), NF1 (read-only root filesystem) og deler av NF7 (recovery) (person 4)
  volumes:
    - name: bidrag-db-data
      persistentVolumeClaim:
        claimName: bidrag-pvc
    - name: pseudonym-db-data
      persistentVolumeClaim:
        claimName: pseudonym-pvc
    # start: Secret-volumer for TLS-sertifikat og databasenokler i steg 9 - oppfyller NF1 (ingen hemmeligheter i image/repo) og NF7 (TLS, nokkelhandtering og kryptert lagring) (person 4 og person 5)
    - name: storage-key-material
      secret:
        secretName: allpodd-storage-secrets
    - name: tls-certificates
      secret:
        secretName: allpodd-tls
    # slutt: Secret-volumer for TLS-sertifikat og databasenokler i steg 9 - oppfyller NF1 (ingen hemmeligheter i image/repo) og NF7 (TLS, nokkelhandtering og kryptert lagring) (person 4 og person 5)
    - name: app-tmp
      emptyDir: {}
    - name: bidrag-tmp
      emptyDir: {}
    - name: pseudonym-tmp
      emptyDir: {}
    - name: web-tmp
      emptyDir: {}
    - name: tls-tmp
      emptyDir: {}
  # slutt: PVC-er og isolerte tmp-volumer for skrivebehov - oppfyller F3 (persistens), NF1 (read-only root filesystem) og deler av NF7 (recovery) (person 4)
# slutt: Herdet service- og podmanifest for steg 8 - oppfyller NF1 (least privilege og defense in depth), NF2 (Kubernetes), NF3 (lokal kjøring) og deler av NF7 (recovery) (person 4)

