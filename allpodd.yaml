# start: Herdet Kubernetes-oppsett med fire separate pods og tjenester - oppfyller NF1 (least privilege og defense in depth), NF2 (Kubernetes), NF3 (lokal kjøring) og deler av NF7 (recovery) (person 4)
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: allpodd
    component: web
    tier: edge
    security: hardened
spec:
  type: NodePort
  selector:
    app: allpodd
    component: web
  ports:
    - name: http
      nodePort: 32199
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: allpodd
    component: app
    tier: application
    security: hardened
spec:
  type: NodePort
  selector:
    app: allpodd
    component: app
  ports:
    - name: http
      nodePort: 30921
      port: 81
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: bidrag-db
  labels:
    app: allpodd
    component: bidrag-db
    tier: backend
    security: hardened
spec:
  selector:
    app: allpodd
    component: bidrag-db
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: pseudonym-db
  labels:
    app: allpodd
    component: pseudonym-db
    tier: backend
    security: hardened
spec:
  selector:
    app: allpodd
    component: pseudonym-db
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: allpodd
    component: web
    tier: edge
    security: hardened
spec:
  serviceAccountName: allpodd-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 10001
  terminationGracePeriodSeconds: 10
  containers:
    - name: web
      image: localhost/web:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
          name: web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "25m"
          memory: "48Mi"
        limits:
          cpu: "100m"
          memory: "96Mi"
      readinessProbe:
        tcpSocket:
          port: web
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        tcpSocket:
          port: web
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
      startupProbe:
        tcpSocket:
          port: web
        periodSeconds: 5
        failureThreshold: 12
      volumeMounts:
        - name: web-tmp
          mountPath: /tmp
  volumes:
    - name: web-tmp
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: allpodd
    component: app
    tier: application
    security: hardened
spec:
  serviceAccountName: allpodd-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 10001
  terminationGracePeriodSeconds: 10
  containers:
    - name: app
      image: localhost/app:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8081
          name: app
      env:
        - name: URL_B_INTERNAL
          value: http://bidrag-db:8082/cgi-bin/index.cgi
        - name: URL_PN_INTERNAL
          value: http://pseudonym-db:8083/cgi-bin/index.cgi
        - name: APP_ALLOWED_ORIGIN
          value: http://localhost:8080
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      volumeMounts:
        - name: app-tmp
          mountPath: /tmp
  volumes:
    - name: app-tmp
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: bidrag-db
  labels:
    app: allpodd
    component: bidrag-db
    tier: backend
    security: hardened
spec:
  serviceAccountName: allpodd-sa
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 10001
  terminationGracePeriodSeconds: 10
  initContainers:
    - name: seed-bidrag-db
      image: localhost/bidrag-db:latest
      imagePullPolicy: Never
      command:
        - sh
        - -c
        - |
          if [ ! -f /data/bidrag.db ]; then
            cp /var/www/bidrag.db /data/bidrag.db
          fi
          chown 10001:10001 /data/bidrag.db
          chmod 660 /data/bidrag.db
      volumeMounts:
        - name: bidrag-db-data
          mountPath: /data
  containers:
    - name: bidrag-db
      image: localhost/bidrag-db:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8082
          name: bidrag-db
      env:
        - name: BIDRAG_DB_PATH
          value: /data/bidrag.db
        - name: PSEUDONYM_INTERNAL_URL
          value: http://pseudonym-db:8083/cgi-bin/index.cgi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "250m"
          memory: "192Mi"
      volumeMounts:
        - name: bidrag-db-data
          mountPath: /data
        - name: bidrag-tmp
          mountPath: /tmp
  volumes:
    - name: bidrag-db-data
      persistentVolumeClaim:
        claimName: bidrag-pvc
    - name: bidrag-tmp
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
