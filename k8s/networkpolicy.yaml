# start: NetworkPolicy som begrenser ytre angrepsflate til TLS-gatewayen - oppfyller NF1 (defense in depth og zero trust), NF2 (Kubernetes) og NF7 (HTTPS-eksponering) (person 4 og person 5)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allpodd-default-deny-ingress
  labels:
    # start: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: network-policy
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
spec:
  podSelector:
    matchLabels:
      app: allpodd
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allpodd-allow-https-only
  labels:
    # start: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: network-policy
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
spec:
  podSelector:
    matchLabels:
      app: allpodd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  egress: []
# slutt: NetworkPolicy som begrenser ytre angrepsflate til TLS-gatewayen - oppfyller NF1 (defense in depth og zero trust), NF2 (Kubernetes) og NF7 (HTTPS-eksponering) (person 4 og person 5)
