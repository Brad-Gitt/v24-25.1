apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-ingress-only
  namespace: webrom
spec:
  podSelector:
    matchLabels:
      app: allpodd
      component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-allow-web-ingress-and-db-egress
  namespace: approm
spec:
  podSelector:
    matchLabels:
      app: allpodd
      component: app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bidragsrom
          podSelector:
            matchLabels:
              app: allpodd
              component: bidrag-db
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pseudonymrom
          podSelector:
            matchLabels:
              app: allpodd
              component: pseudonym-db
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bidrag-allow-app-ingress-and-pseudonym-egress
  namespace: bidragsrom
spec:
  podSelector:
    matchLabels:
      app: allpodd
      component: bidrag-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: approm
          podSelector:
            matchLabels:
              app: allpodd
              component: app
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pseudonymrom
          podSelector:
            matchLabels:
              app: allpodd
              component: pseudonym-db
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pseudonym-allow-app-and-bidrag-ingress
  namespace: pseudonymrom
spec:
  podSelector:
    matchLabels:
      app: allpodd
      component: pseudonym-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: approm
          podSelector:
            matchLabels:
              app: allpodd
              component: app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bidragsrom
          podSelector:
            matchLabels:
              app: allpodd
              component: bidrag-db
      ports:
        - protocol: TCP
          port: 8083
  egress: []