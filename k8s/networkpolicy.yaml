# start: NetworkPolicy som isolerer fire pods og bare slipper gjennom forventet trafikk - oppfyller NF1 (defense in depth og zero trust) og NF2 (Kubernetes) (person 4)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allpodd-default-deny-ingress
  labels:
    # start: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: network-policy
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
spec:
  podSelector:
    matchLabels:
      app: allpodd
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allpodd-allow-dns-egress
  labels:
    # start: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: network-policy
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for nettverkspolicy - oppfyller NF6 (merking av skyverdier) (person 4)
spec:
  podSelector:
    matchLabels:
      app: allpodd
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allpodd-allow-external-to-web
  labels:
    app: allpodd
    component: network-policy
    tier: control
    security: hardened
spec:
  podSelector:
    matchLabels:
      app: allpodd
      component: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allpodd-allow-external-to-app
  labels:
    app: allpodd
    component: network-policy
    tier: control
    security: hardened
spec:
  podSelector:
    matchLabels:
      app: allpodd
      component: app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
---
