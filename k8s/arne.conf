apiVersion: v1
kind: Config

clusters:
- cluster:
    certificate-authority: /var/snap/microk8s/current/certs/ca.crt
    server: https://127.0.0.1:16443
  name: microk8s-cluster

contexts:
- context:
    cluster: microk8s-cluster
    user: arne
  name: arne

current-context: arne

users:
- name: arne
  user:
    client-certificate: ../arne.crt
    client-key: ../arne.key
