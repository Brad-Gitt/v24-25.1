# start: Dedikert servicekonto og RBAC uten API-privilegier - oppfyller NF1 (least privilege og zero trust) og NF2 (Kubernetes) (person 4)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: allpodd-sa
  labels:
    # start: Identifikasjonsetiketter for servicekontoen - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: service-account
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for servicekontoen - oppfyller NF6 (merking av skyverdier) (person 4)
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allpodd-no-api-access
  labels:
    # start: Identifikasjonsetiketter for RBAC-rollen - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: rbac
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for RBAC-rollen - oppfyller NF6 (merking av skyverdier) (person 4)
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allpodd-no-api-access
  labels:
    # start: Identifikasjonsetiketter for RBAC-bindingen - oppfyller NF6 (merking av skyverdier) (person 4)
    app: allpodd
    component: rbac
    tier: control
    security: hardened
    # slutt: Identifikasjonsetiketter for RBAC-bindingen - oppfyller NF6 (merking av skyverdier) (person 4)
subjects:
  - kind: ServiceAccount
    name: allpodd-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: allpodd-no-api-access
# slutt: Dedikert servicekonto og RBAC uten API-privilegier - oppfyller NF1 (least privilege og zero trust) og NF2 (Kubernetes) (person 4)
